
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Boutique - AccessoShop</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <style>
        /* Style pour s'assurer que l'état actif dans la navbar haute s'affiche bien en couleur dorée */
        .navbar ul li a.active {
            color: var(--gold) !important;
            font-weight: 600;
        }
        /* Petit ajustement d'espace maintenant que la barre d'outils est vide */
        .shop-toolbar {
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <header class="page-header">
        <p class="eyebrow" th:text="'Collection ' + ${currentCategory}">Collection</p>
        <h1>Accessoires disponibles</h1>
        <div sec:authorize="hasRole('ADMIN')" class="admin-header-actions">
            <a th:href="@{/products/admin/new}" class="btn-primary">Ajouter un produit</a>
        </div>
    </header>

    <main class="container-fluid">
        <div class="shop-toolbar"></div>

        <div class="products-grid">
            <div th:each="product : ${products}" class="product-card animate-in">
                <a th:href="@{/products/{id}(id=${product.id})}" style="display:block;color:inherit;">
                    <div class="product-img">
                        <div class="product-badge" th:if="${product.featured}">Favori</div>
                        <img th:src="${product.imageUrl}"
                             th:alt="${product.name}"
                             onerror="this.onerror=null; if(this.src.endsWith('.jpg')) { this.src=this.src.replace('.jpg', '.png'); } else { this.src=this.src + '.jpg'; }"/>
                    </div>
                    <div class="product-info">
                        <div class="category-tag" th:text="${product.category}">Catégorie</div>
                        <h3 th:text="${product.name}">Nom du produit</h3>
                        <div class="product-rating">
                            <span class="stars">★★★★★</span>
                            <span style="font-size:0.8rem;color:#999;" th:text="${#numbers.formatDecimal(product.rating, 1, 1)}">4.5</span>
                        </div>
                        <div class="product-footer">
                            <div class="price">
                                <th:block th:text="${#numbers.formatDecimal(product.price, 1, 2)}">0.00</th:block>
                                <span>MAD</span>
                            </div>
                            <div class="add-btn">+</div>
                        </div>
                    </div>
                </a>
                <div sec:authorize="hasRole('ADMIN')" class="admin-card-actions">
                    <a th:href="@{/products/admin/edit/{id}(id=${product.id})}">Modifier</a>
                    <a th:href="@{/products/admin/delete/{id}(id=${product.id})}"
                        onclick="return confirm('Supprimer ce produit ?')">Supprimer</a>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(products)}" class="empty-state">
            <h2>Aucun produit disponible</h2>
            <p>Revenez bientôt pour découvrir nos nouvelles collections.</p>
            <a th:href="@{/}" class="btn-primary" style="display:inline-flex;margin-top:1.5rem;">← Retour à l'accueil</a>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
