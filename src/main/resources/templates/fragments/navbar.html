
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
</head>
<body>
<div th:fragment="navbar">
    <nav class="navbar">
        <a th:href="@{/}" class="navbar-brand">Accesso<span>Shop</span></a>

        <ul>
            <li>
                <a th:href="@{/}">Accueil</a>
            </li>
            <li>
                <a th:href="@{/products(category=boucle)}"
                   th:classappend="${currentCategory == 'boucle'} ? 'active'">Boucles</a>
            </li>
            <li>
                <a th:href="@{/products(category=montre)}"
                   th:classappend="${currentCategory == 'montre'} ? 'active'">Montres</a>
            </li>
            <li>
                <a th:href="@{/products(category=collier)}"
                   th:classappend="${currentCategory == 'collier'} ? 'active'">Colliers</a>
            </li>
            <li>
                <a th:href="@{/products(category=bague)}"
                   th:classappend="${currentCategory == 'bague'} ? 'active'">Bagues</a>
            </li>
            <li>
                <a th:href="@{/products(category=bracelet)}"
                   th:classappend="${currentCategory == 'bracelet'} ? 'active'">Bracelets</a>
            </li>
            <li sec:authorize="isAuthenticated() && !hasRole('ADMIN')">
                <a th:href="@{/order/my-purchases}">Mes Achats</a>
            </li>
            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/products/admin/new}">Admin</a>
            </li>
            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/order/admin/list}"
                   style="color:var(--gold-dark);font-weight:600;"> Commandes</a>
            </li>
        </ul>

        <div class="nav-actions">

            <!-- Visiteur non connecté -->
            <div sec:authorize="isAnonymous()" style="display:flex;gap:10px;">
                <a th:href="@{/login}"    class="btn-outline">Connexion</a>
                <a th:href="@{/register}" class="btn-outline">Inscription</a>
            </div>

            <!-- Utilisateur connecté -->
            <div sec:authorize="isAuthenticated()"
                 style="display:flex;align-items:center;gap:10px;">
                <span style="font-size:0.82rem;color:var(--mid-gray);white-space:nowrap;">
                    Bonjour,
                    <span sec:authentication="name"
                          style="color:var(--gold);font-weight:600;">Utilisateur</span>
                </span>
                <form th:action="@{/logout}" method="post" style="margin:0;">
                    <button type="submit" class="btn-outline"
                            style="cursor:pointer;background:none;font-family:var(--font-body);">
                        Déconnexion
                    </button>
                </form>
            </div>

            <!-- Panier — même style que les autres boutons -->
            <a th:href="@{/cart}" class="btn-outline">🛒 Panier</a>

        </div>
    </nav>
</div>
</body>
</html>
