
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
</head>
<body>
<div th:fragment="navbar">
    <nav class="navbar">
        <a th:href="@{/}" class="navbar-brand">Accesso<span>Shop</span></a>

        <!-- ===== NAV CLIENT (non-admin) ===== -->
        <ul sec:authorize="!hasRole('ADMIN')">
            <li><a th:href="@{/}">Accueil</a></li>
            <li>
                <a th:href="@{/products(category=boucle)}"
                   th:classappend="${currentCategory == 'boucle'} ? 'active'">Boucles</a>
            </li>
            <li>
                <a th:href="@{/products(category=montre)}"
                   th:classappend="${currentCategory == 'montre'} ? 'active'">Montres</a>
            </li>
            <li>
                <a th:href="@{/products(category=collier)}"
                   th:classappend="${currentCategory == 'collier'} ? 'active'">Colliers</a>
            </li>
            <li>
                <a th:href="@{/products(category=bague)}"
                   th:classappend="${currentCategory == 'bague'} ? 'active'">Bagues</a>
            </li>
            <li>
                <a th:href="@{/products(category=bracelet)}"
                   th:classappend="${currentCategory == 'bracelet'} ? 'active'">Bracelets</a>
            </li>
            <li sec:authorize="isAuthenticated()">
                <a th:href="@{/order/my-purchases}">Mes Achats</a>
            </li>
        </ul>

        <!-- ===== NAV ADMIN (simplifié) ===== -->
        <ul sec:authorize="hasRole('ADMIN')">
            <li><a th:href="@{/}">Accueil</a></li>
            <li><a th:href="@{/products}">Boutique</a></li>
        </ul>

        <!-- ===== ACTIONS DROITE ===== -->
        <div class="nav-actions">

            <!-- Visiteur non connecté -->
            <div sec:authorize="isAnonymous()" style="display:flex;gap:10px;">
                <a th:href="@{/login}"    class="btn-outline">Connexion</a>
                <a th:href="@{/register}" class="btn-outline">Inscription</a>
            </div>

            <!-- Admin connecté -->
            <div sec:authorize="hasRole('ADMIN')" style="display:flex;align-items:center;gap:10px;">
                <a th:href="@{/products/admin/new}" class="btn-outline">
                    ✚ Produits
                </a>
                <a th:href="@{/order/admin/list}" class="btn-admin-orders">
                    📦 Commandes
                </a>
                <span class="nav-greeting">
                    <span sec:authentication="name">Admin</span>
                </span>
                <form th:action="@{/logout}" method="post" style="margin:0;">
                    <button type="submit" class="btn-outline"
                            style="cursor:pointer;background:none;font-family:var(--font-body);">
                        Déconnexion
                    </button>
                </form>
            </div>

            <!-- Client connecté -->
            <div sec:authorize="isAuthenticated() && !hasRole('ADMIN')"
                 style="display:flex;align-items:center;gap:12px;">
                <span class="nav-greeting">
                    Bonjour,
                    <span sec:authentication="name"
                          style="color:var(--gold);font-weight:600;">Utilisateur</span>
                </span>
                <form th:action="@{/logout}" method="post" style="margin:0;">
                    <button type="submit" class="btn-outline"
                            style="cursor:pointer;background:none;font-family:var(--font-body);">
                        Déconnexion
                    </button>
                </form>
            </div>

            <!-- Panier (clients uniquement) -->
            <a th:href="@{/cart}" class="cart-btn" sec:authorize="!hasRole('ADMIN')">
                🛒 Panier
            </a>
        </div>
    </nav>
</div>
</body>
</html>
