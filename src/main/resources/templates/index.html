<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AccessoShop — Accessoires Premium</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="hero">
    <div class="hero-text">
        <div class="hero-badge">✨ Nouvelle Collection 2026</div>
        <h1>L'élégance au<br/>bout des <em>doigts</em></h1>
        <p>Découvrez notre collection exclusive d'accessoires premium — montres, colliers, bagues et bracelets sélectionnés avec soin.</p>
        <div class="hero-actions">
            <a th:href="@{/products}" class="btn-primary">Découvrir la boutique →</a>
        </div>
    </div>
    <div class="hero-image">
        <div class="hero-img-card">
            <img th:src="@{/uploads/gold1.png}" alt="Bijou doré" onerror="this.onerror=null; this.src='/uploads/gold1.jpg';"/>
        </div>
        <div class="hero-img-card">
            <img th:src="@{/uploads/bracelet1.png}" alt="Bracelet élégant" onerror="this.onerror=null; this.src='/uploads/bracelet1.jpg';"/>
        </div>
    </div>
</section>

<section class="section">
    <div class="section-header">
        <h2>Nos Collections</h2>
        <div class="section-divider"></div>
    </div>
    <div class="categories-grid">
        <a th:href="@{/products(category=montre)}" class="category-card">
            <img th:src="@{/uploads/montre1.png}" alt="Montres" onerror="this.onerror=null; this.src='/uploads/montre1.jpg';"/>
            <div class="category-overlay"><h3>Montres</h3></div>
        </a>
        <a th:href="@{/products(category=collier)}" class="category-card">
            <img th:src="@{/uploads/collier1.png}" alt="Colliers" onerror="this.onerror=null; this.src='/uploads/collier1.jpg';"/>
            <div class="category-overlay"><h3>Colliers</h3></div>
        </a>
        <a th:href="@{/products(category=bague)}" class="category-card">
            <img th:src="@{/uploads/bague1.png}" alt="Bagues" onerror="this.onerror=null; this.src='/uploads/bague1.jpg';"/>
            <div class="category-overlay"><h3>Bagues</h3></div>
        </a>
        <a th:href="@{/products(category=bracelet)}" class="category-card">
            <img th:src="@{/uploads/bracelet1.png}" alt="Bracelets" onerror="this.onerror=null; this.src='/uploads/bracelet1.jpg';"/>
            <div class="category-overlay"><h3>Bracelets</h3></div>
        </a>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
