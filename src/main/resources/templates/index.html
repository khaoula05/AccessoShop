<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AccessoShop — Accessoires Premium</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="hero">
    <div class="hero-text">
        <div class="hero-badge">✨ Nouvelle Collection 2026</div>
        <h1>L'élégance au<br/>bout des <em>doigts</em></h1>
        <p>Découvrez notre collection exclusive d'accessoires premium — montres, colliers, bagues et bracelets sélectionnés avec soin.</p>
        <div class="hero-actions">
            <a th:href="@{/products}" class="btn-primary">Découvrir la boutique →</a>
        </div>
    </div>
    <div class="hero-image">
        <div class="hero-img-card">
            <img src="https://images.unsplash.com/photo-1602751584552-8ba73aad10e1?w=800&q=80" alt="Bracelet jonc d'art en or"/>
        </div>
        <div class="hero-img-card">
            <img src="https://images.unsplash.com/photo-1605100804763-247f67b3557e?w=800&q=80" alt="Bague émeraude et bijoux sur marbre"/>
        </div>
    </div>
</section>

<section class="section">
    <div class="section-header">
        <h2>Nos Collections</h2>
        <div class="section-divider"></div>
    </div>
    <div class="categories-grid">
        <a th:href="@{/products(category=montre)}" class="category-card">
            <img src="https://images.unsplash.com/photo-1547996160-81dfa63595aa?w=600&q=80" alt="Montre automatique de luxe"/>
            <div class="category-overlay"><h3>Montres</h3></div>
        </a>
        <a th:href="@{/products(category=collier)}" class="category-card">
            <img src="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=600&q=80" alt="Collier pendentif en diamant"/>
            <div class="category-overlay"><h3>Colliers</h3></div>
        </a>
        <a th:href="@{/products(category=bague)}" class="category-card">
            <img src="https://images.unsplash.com/photo-1603561591411-07134e71a2a9?w=600&q=80" alt="Bagues d'or épurées"/>
            <div class="category-overlay"><h3>Bagues</h3></div>
        </a>
        <a th:href="@{/products(category=bracelet)}" class="category-card">
            <img src="https://images.unsplash.com/photo-1611591437281-460bfbe1220a?w=600&q=80" alt="Bracelet manchette pavé de diamants"/>
            <div class="category-overlay"><h3>Bracelets</h3></div>
        </a>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
