<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AccessoShop — Accessoires Premium</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="hero">
    <div class="hero-text">
        <div class="hero-badge">✨ Nouvelle Collection 2026</div>
        <h1>L'élégance au<br/>bout des <em>doigts</em></h1>
        <p>Découvrez notre collection exclusive d'accessoires premium — montres, colliers, bagues et bracelets sélectionnés avec soin.</p>
        <div class="hero-actions">
            <a th:href="@{/products}" class="btn-primary">Découvrir la boutique →</a>
        </div>
    </div>
    <div class="hero-image">
        <div class="hero-img-card">
            <img src="https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=800" alt="Bijou doré"/>
        </div>
        <div class="hero-img-card">
            <img src="https://images.unsplash.com/photo-1573408301185-9519eb232b5f?w=800" alt="Bracelet élégant"/>
        </div>
    </div>
</section>

<section class="section">
    <div class="section-header">
        <h2>Nos Collections</h2>
        <div class="section-divider"></div>
    </div>
    <div class="categories-grid">
        <a th:href="@{/products(category=montre)}" class="category-card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800" alt="Montres"/>
            <div class="category-overlay"><h3>Montres</h3></div>
        </a>
        <a th:href="@{/products(category=collier)}" class="category-card">
            <img src="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=800" alt="Colliers"/>
            <div class="category-overlay"><h3>Colliers</h3></div>
        </a>
        <a th:href="@{/products(category=bague)}" class="category-card">
            <img src="https://images.unsplash.com/photo-1605100804763-247f67b3557e?w=800" alt="Bagues"/>
            <div class="category-overlay"><h3>Bagues</h3></div>
        </a>
        <a th:href="@{/products(category=bracelet)}" class="category-card">
            <img src="https://images.unsplash.com/photo-1573408301185-9519eb232b5f?w=800" alt="Bracelets"/>
            <div class="category-overlay"><h3>Bracelets</h3></div>
        </a>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
