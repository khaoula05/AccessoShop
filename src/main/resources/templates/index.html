
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AccessoShop — Accessoires Premium</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="hero">
    <div class="hero-text">
        <div class="hero-badge">✨ Nouvelle Collection 2026</div>
        <h1>L'élégance au<br/>bout des <em>doigts</em></h1>
        <p>Découvrez notre collection exclusive d'accessoires premium — montres, colliers, bagues et bracelets sélectionnés avec soin.</p>
        <div class="hero-actions">
            <a th:href="@{/products}" class="btn-primary">Découvrir la boutique →</a>
        </div>
    </div>
    <div class="hero-image">
        <div class="hero-img-card">
            <img src="https://res.cloudinary.com/duh7dcr8a/image/upload/v1779977301/hero1_bmycrh.png" alt="Bijou doré"/>
        </div>
        <div class="hero-img-card">
            <img src="https://res.cloudinary.com/duh7dcr8a/image/upload/v1779977302/hero2_lgoqf0.png" alt="Bracelet élégant"/>
        </div>
    </div>
</section>

<section class="section">
    <div class="section-header">
        <h2>Nos Collections</h2>
        <div class="section-divider"></div>
    </div>
    <div class="categories-grid" style="grid-template-columns: repeat(5, 1fr);">
        <a th:href="@{/products(category=montre)}" class="category-card">
            <img src="https://res.cloudinary.com/duh7dcr8a/image/upload/v1779977302/Montres_ckcoio.png" alt="Montres"/>
            <div class="category-overlay"><h3>Montres</h3></div>
        </a>
        <a th:href="@{/products(category=collier)}" class="category-card">
            <img src="https://res.cloudinary.com/duh7dcr8a/image/upload/v1779977302/colliers_brduqc.png" alt="Colliers"/>
            <div class="category-overlay"><h3>Colliers</h3></div>
        </a>
        <a th:href="@{/products(category=bague)}" class="category-card">
            <img src="https://res.cloudinary.com/duh7dcr8a/image/upload/v1779977300/bagues_j2fqnp.jpg" alt="Bagues"/>
            <div class="category-overlay"><h3>Bagues</h3></div>
        </a>
        <a th:href="@{/products(category=bracelet)}" class="category-card">
            <img src="https://res.cloudinary.com/duh7dcr8a/image/upload/v1779977301/bracelets_qtfkjb.png" alt="Bracelets"/>
            <div class="category-overlay"><h3>Bracelets</h3></div>
        </a>
        <a th:href="@{/products(category=boucle)}" class="category-card">
            <img src="https://res.cloudinary.com/duh7dcr8a/image/upload/v1779994978/Boucles_mchtmk.png" alt="Boucles d'oreilles"
                 onerror="this.onerror=null; this.src='/uploads/gold3.png';"/>
            <div class="category-overlay"><h3>Boucles</h3></div>
        </a>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
