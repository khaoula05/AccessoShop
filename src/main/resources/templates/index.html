<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AccessoShop — Accessoires Premium</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    
    <style>
        body {
            background-color: #fcfbfa; /* Fond blanc cassé très doux comme sur l’image */
        }
        
        /* Section Hero */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 80px 10%;
            gap: 50px;
            background: radial-gradient(circle at 80% 50%, #f3ede4 0%, transparent 60%); /* Recrée le halo beige chaud en arrière-plan */
        }
        
        .hero-text h1 em {
            color: #bfa15f; /* Teinte dorée premium pour le mot "doigts" */
            font-style: italic;
        }

        .hero-image {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .hero-img-card {
            border-radius: 24px; /* Coins très arrondis comme sur le design */
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08); /* Ombre douce haut de gamme */
            transition: transform 0.3s ease;
        }
        
        .hero-img-card:hover {
            transform: translateY(-5px);
        }

        .hero-img-card img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: cover;
        }

        /* Section Collections / Catégories */
        .section-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 10px;
            color: #1a1a1a;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            padding: 40px 10%;
        }

        .category-card {
            position: relative;
            border-radius: 16px; /* Coins arrondis des cartes de collection */
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .category-card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            display: block;
        }

        /* Style du texte en bas à gauche sur l'image */
        .category-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 100%); /* Dégradé discret pour rendre le texte lisible */
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
        }

        .category-overlay h3 {
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 500;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="hero">
    <div class="hero-text">
        <div class="hero-badge">✨ Nouvelle Collection 2026</div>
        <h1>L'élégance au<br/>bout des <em>doigts</em></h1>
        <p>Découvrez notre collection exclusive d'accessoires premium — montres, colliers, bagues et bracelets sélectionnés avec soin.</p>
        <div class="hero-actions">
            <a th:href="@{/products}" class="btn-primary">Découvrir la boutique →</a>
        </div>
    </div>
    
    <div class="hero-image">
        <div class="hero-img-card" style="width: 260px;">
            <img src="https://images.unsplash.com/photo-1602751584552-8ba73aad10e1?w=500&q=80" alt="Bracelet d'art premium"/>
        </div>
        <div class="hero-img-card" style="width: 260px; margin-top: 40px;">
            <img src="https://images.unsplash.com/photo-1605100804763-247f67b3557e?w=500&q=80" alt="Bague émeraude et anneaux sur marbre"/>
        </div>
    </div>
</section>

<section class="section">
    <div class="section-header">
        <h2>Nos Collections</h2>
        <div class="section-divider"></div>
    </div>
    
    <div class="categories-grid">
        <a th:href="@{/products(category=montre)}" class="category-card">
            <img src="https://images.unsplash.com/photo-1547996160-81dfa63595aa?w=500&q=80" alt="Collection Montres"/>
            <div class="category-overlay"><h3>Montres</h3></div>
        </a>
        
        <a th:href="@{/products(category=collier)}" class="category-card">
            <img src="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=500&q=80" alt="Collection Colliers"/>
            <div class="category-overlay"><h3>Colliers</h3></div>
        </a>
        
        <a th:href="@{/products(category=bague)}" class="category-card">
            <img src="https://images.unsplash.com/photo-1603561591411-07134e71a2a9?w=500&q=80" alt="Collection Bagues"/>
            <div class="category-overlay"><h3>Bagues</h3></div>
        </a>
        
        <a th:href="@{/products(category=bracelet)}" class="category-card">
            <img src="https://images.unsplash.com/photo-1611591437281-460bfbe1220a?w=500&q=80" alt="Collection Bracelets"/>
            <div class="category-overlay"><h3>Bracelets</h3></div>
        </a>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
