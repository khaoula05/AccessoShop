<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Inscription — AccessoShop</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="auth-page">
    <div class="auth-visual">
        <div style="z-index:1;position:relative;text-align:center;">
            <div style="font-family:var(--font-display);font-size:1.8rem;color:var(--gold);margin-bottom:2rem;">
                Accesso<span style="color:white;">Shop</span>
            </div>
            <h2>Rejoignez<br/>la communauté 💎</h2>
            <p style="margin-top:1rem;max-width:300px;color:rgba(255,255,255,0.65);">Créez votre compte et accédez à une sélection premium d'accessoires de mode.</p>
            <div style="margin-top:3rem;font-size:4rem;">✨</div>
            <p style="color:rgba(255,255,255,0.4);font-size:0.82rem;margin-top:1rem;">Livraison gratuite dès votre première commande</p>
        </div>
    </div>

    <div class="auth-form-section">
        <div class="auth-form-box">
            <h1>Créer un compte</h1>
            <p>Rejoignez AccessoShop gratuitement</p>

            <div class="alert alert-error" th:if="${error}" th:text="${error}">Erreur</div>

            <form th:action="@{/register}" method="post" th:object="${user}">
                <div class="form-group">
                    <label for="name">Nom complet</label>
                    <input type="text" id="name" th:field="*{name}" placeholder="Votre nom complet" required/>
                </div>
                <div class="form-group">
                    <label for="email">Adresse email</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="votre@email.com" required/>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" th:field="*{password}" placeholder="Minimum 6 caractères" required minlength="6"/>
                </div>
                <button type="submit" class="form-submit">Créer mon compte →</button>
            </form>

            <div class="auth-link">
                Déjà un compte ? <a th:href="@{/login}">Se connecter</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
