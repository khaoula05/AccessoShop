<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Commande Confirmée — AccessoShop</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <style>
        body { background: #fdfbf7; font-family: 'Plus Jakarta Sans', sans-serif; }
        .confirmation-box { max-width: 550px; margin: 6rem auto; background: white; padding: 3.5rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid #eef0f2; text-align: center; }
        .success-icon { font-size: 4rem; color: #cca43b; margin-bottom: 1.5rem; display: inline-block; animation: scaleUp 0.4s ease-out; }
        h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: #1a1a1a; margin-bottom: 1rem; font-weight: 500; }
        p { color: #666; line-height: 1.6; font-size: 1.05rem; margin-bottom: 2.5rem; }
        .actions-group { display: flex; flex-direction: column; gap: 1rem; }
        .btn-invoice { display: block; padding: 12px; background: #000; color: #fff; text-decoration: none; border-radius: 30px; font-weight: 600; font-size: 0.95rem; transition: background 0.2s; }
        .btn-invoice:hover { background: #222; }
        .btn-home { display: block; padding: 12px; background: transparent; color: #666; text-decoration: none; border-radius: 30px; font-weight: 500; font-size: 0.95rem; border: 1px solid #ddd; transition: all 0.2s; }
        .btn-home:hover { background: #fafafa; color: #000; border-color: #999; }
        @keyframes scaleUp { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="confirmation-box">
    <span class="success-icon">✨</span>
    <h1>Commande validée !</h1>
    <p>Merci pour votre confiance. Votre commande a été enregistrée avec succès et est en cours de traitement par notre équipe de préparation.</p>
    
    <div class="actions-group">
    
        <a th:href="@{/order/my-purchases}" class="btn-invoice">Suivre mes achats →</a>
        <a th:href="@{/}" class="btn-home">Retourner à l'accueil</a>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
