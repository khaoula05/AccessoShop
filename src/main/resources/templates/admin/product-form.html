<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Administration - Produit</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <style>
        .drag-drop-zone {
            border: 2px dashed #cca43b;
            padding: 30px 20px;
            text-align: center;
            background: #fdfbf7;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .drag-drop-zone:hover, .drag-drop-zone.dragover {
            background: #f5efe0;
            border-color: #a3822e;
        }
        .drag-drop-zone p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }
        .preview-container {
            margin-top: 15px;
            display: none;
        }
        .preview-image {
            max-width: 120px;
            max-height: 120px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<header class="page-header">
    <p class="eyebrow">Administration</p>
    <h1>Ajouter un produit</h1>
    <p class="page-subtitle">Choisissez la categorie d'accessoire puis enregistrez. Le produit apparaitra dans sa collection.</p>
</header>

<main class="admin-page">
    <form th:action="@{/products/admin/save}" th:object="${product}" method="post" enctype="multipart/form-data" class="admin-form">
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{imageUrl}"/>

        <div class="form-group">
            <label for="name">Nom du produit</label>
            <input id="name" type="text" th:field="*{name}" placeholder="Ex: Bracelet argent premium" required/>
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Erreur</p>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="category">Categorie d'accessoire</label>
                <select id="category" th:field="*{category}" required>
                    <option value="">Choisir une categorie</option>
                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}">Categorie</option>
                </select>
                <p class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Erreur</p>
            </div>

            <div class="form-group">
                <label for="price">Prix MAD</label>
                <input id="price" type="number" th:field="*{price}" min="1" step="0.01" required/>
                <p class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Erreur</p>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="stock">Stock</label>
                <input id="stock" type="number" th:field="*{stock}" min="0" step="1"/>
                <p class="field-error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}">Erreur</p>
            </div>

            <div class="form-group">
                <label for="rating">Note</label>
                <input id="rating" type="number" th:field="*{rating}" min="0" max="5" step="0.1"/>
            </div>
        </div>

        <div class="form-group">
            <label>Image du produit</label>
            <div id="drop-zone" class="drag-drop-zone">
                <p>Glissez-déposez une image ici ou cliquez pour parcourir vos fichiers</p>
                <input type="file" id="file-input" name="imageFile" accept="image/*" style="display: none;" />
                
                <div id="preview-container" class="preview-container">
                    <img id="preview-img" class="preview-image" src="" alt="Aperçu du produit" />
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}" placeholder="Description courte du produit"></textarea>
        </div>

        <label class="check-row">
            <input type="checkbox" th:field="*{featured}"/>
            <span>Afficher aussi ce produit dans les coups de coeur de l'accueil</span>
        </label>

        <div class="admin-form-actions">
            <a th:href="@{/products}" class="btn-secondary">Annuler</a>
            <button type="submit" class="btn-primary">Enregistrer</button>
        </div>
    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const previewContainer = document.getElementById('preview-container');
    const previewImg = document.getElementById('preview-img');

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        
        if (e.dataTransfer.files.length > 0) {
            const files = e.dataTransfer.files;
            
            // Correction de sécurité pour forcer l'ajout dans l'élément input file
            const dataTransfer = new DataTransfer();
            dataTransfer.items.add(files[0]);
            fileInput.files = dataTransfer.files;
            
            handleFile(files[0]);
        }
    });

    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
            handleFile(fileInput.files[0]);
        }
    });

    function handleFile(file) {
        if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function(e) {
                previewImg.src = e.target.result;
                previewContainer.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }
</script>
</body>
</html>
