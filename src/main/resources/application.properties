spring.application.name=AccessoShop

# ===== BASE DE DONNEES MySQL LOCAL =====
spring.datasource.url=jdbc:mysql://localhost:3306/accessoshop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== PORT =====
server.port=8085

# ===== THYMELEAF =====
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ===== UPLOAD IMAGES =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== CLOUDINARY (optionnel en local) =====
cloudinary.cloud-name=ton_cloud_name
cloudinary.api-key=ton_api_key
cloudinary.api-secret=ton_api_secret