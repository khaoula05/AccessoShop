on:
  push:
    branches:
      - main
      - khaoula-AIT-ATTA-dev
      - Nourelhouda-ELKASRA-dev
  pull_request:
    branches:
      - main

jobs:
  build-and-analyze:
    name: Build, Test and Quality Scan
    runs-on: ubuntu-latest
    steps:
      # 1. Télécharger le projet
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Installer Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Compiler et lancer les tests
      - name: Build and Test with Maven
        run: mvn -B clean verify --file pom.xml

      # 4. Analyse SonarCloud
      - name: SonarCloud Quality Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.6.0.6792:sonar \
          -Dsonar.projectKey=Khaoula05_AccessoShop \
          -Dsonar.organization=khaoula05 \
          -Dsonar.host.url=https://sonarcloud.io
