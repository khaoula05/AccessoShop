name: Java CI/CD Pipeline - AccessoShop

on:
  push:
    branches: [ "main", "khaoula-AIT-ATTA-dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-analyze:
    name: Build, Test and Quality Scan
    runs-on: ubuntu-latest

    steps:
    # 1. Récupération du code (Historique complet pour SonarCloud)
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Configuration du JDK 17 (Nécessaire pour Spring Boot et Sonar)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 3. Build et exécution de TOUS les tests (JUnit, Mockito, MockMvc, H2, JPA)
    # On utilise 'verify' pour s'assurer que les tests d'intégration sont lancés
    - name: Build and Test with Maven
      run: mvn -B clean verify --file pom.xml

    # 4. ÉTAPE KHAOULA : Scan de Qualité SonarCloud
    # Cette étape analyse le code + récupère les résultats des tests effectués juste avant
    - name: SonarCloud Quality Analysis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: >
        mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar 
        -Dsonar.projectKey=Khaoula05_AccessoShop 
        -Dsonar.organization=khaoula05
        -Dsonar.host.url=https://sonarcloud.ios